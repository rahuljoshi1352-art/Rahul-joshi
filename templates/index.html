<!DOCTYPE html>
<html>

<head>
    <title>Available Flights</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px auto;
        }

        th,
        td {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<body>
    <h1>Available Flights</h1>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Source</th>
            <th>Destination</th>
            <th>Departure</th>
            <th>Arrival</th>
        </tr>
        {% for flight in flights %}
        <tr>
            <td>{{ flight[0] }}</td>
            <td>{{ flight[1] }}</td>
            <td>{{ flight[2] }}</td>
            <td>{{ flight[3] }}</td>
            <td>{{ flight[4] }}</td>
        </tr>
        {% endfor %}
    </table>

    <h2>Add New Flight</h2>
    <form action="/add_flight" method="POST">
        Source: <input type="text" name="source" required><br>
        Destination: <input type="text" name="destination" required><br>
        Departure (HH:MM:SS): <input type="text" name="departure_time" required><br>
        Arrival (HH:MM:SS): <input type="text" name="arrival_time" required><br>
        <input type="submit" value="Add Flight">
    </form>
</body>


</html>
